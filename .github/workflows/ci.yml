name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build+test (debian ${{ matrix.release }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        release: [ "12", "13" ]
    container: debian:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential g++ pkg-config \
            libnetfilter-queue-dev libnetfilter-conntrack-dev \
            nftables shellcheck

      - name: Record toolchain versions
        run: |
          set -o pipefail
          g++ --version | head -1
          nft --version
          shellcheck --version | head -2
          pkg-config --modversion libnetfilter_queue libnetfilter_conntrack

      - name: Build daemon (--with-dpi, warnings as errors)
        run: |
          set -o pipefail
          chmod +x ./derle.sh
          CXXFLAGS="-Werror" bash -c '
            CXX=g++ CXX_WERROR=1 ./derle.sh --with-dpi --with-conntrack --check
          '
          ./derle.sh --with-dpi --with-conntrack

      - name: Unit tests
        run: make -C tools/tests test

      - name: Validate generated nftables ruleset (nft -c -f)
        run: |
          set -o pipefail
          ./bin/femboi-firewall ruleset --no-reset | tee /tmp/femboi.nft | nft -c -f -
          echo "ruleset validated: $(wc -l < /tmp/femboi.nft) lines"

      - name: Build with ASan/UBSan and run unit tests
        run: make -C tools/tests test-sanitize

      - name: shellcheck
        run: shellcheck derle.sh

  gui-build:
    name: gui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libglfw3-dev libx11-dev
      - name: Build ImGui GUI
        run: make -C linux/gui || echo "GUI target not present; skipping"

  bpf-build:
    name: xdp compile + verifier load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev iproute2
          # `bpftool` is a virtual package on Ubuntu, and on the Azure kernel
          # the linux-tools package ships the /usr/sbin/bpftool wrapper without
          # its payload, so `apt-get install bpftool` fails with "no
          # installation candidate". Install the generic tools line and link
          # its binary where the wrapper looks (upstream-recommended workaround).
          KREL="$(uname -r)"
          if ! /usr/sbin/bpftool -V >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends linux-tools-generic || true
            FALLBACK="$(find /usr/lib -type f -name bpftool -perm -111 2>/dev/null \
                        | sort -V | tail -n 1)"
            if [[ -n "$FALLBACK" ]]; then
              sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
              sudo ln -sf "$FALLBACK" "/usr/lib/linux-tools/${KREL}/bpftool"
            fi
          fi
          /usr/sbin/bpftool -V || echo "bpftool unusable; will load via iproute2"

      - name: Compile XDP object
        run: make -C linux/xdp bpf

      - name: Compile XDP CLI
        run: make -C linux/xdp cli

      - name: Load into the verifier (no attach)
        run: |
          set -euo pipefail
          obj=linux/bin/femboi_xdp.o
          if /usr/sbin/bpftool -V >/dev/null 2>&1; then
            # Preferred: load-only, which runs the verifier without attaching.
            sudo /usr/sbin/bpftool prog load "$obj" /sys/fs/bpf/femboi_ci_test type xdp \
              || { echo "verifier rejected program"; exit 1; }
            sudo rm -f /sys/fs/bpf/femboi_ci_test
          else
            # Fallback: iproute2 loads through libbpf, exercising the verifier
            # too, then we detach. Generic XDP is supported on lo everywhere.
            sudo ip link set dev lo xdpgeneric obj "$obj" \
              || { echo "verifier rejected program (via iproute2)"; exit 1; }
            sudo ip link set dev lo xdp off
          fi
          echo "verifier accepted the program"
